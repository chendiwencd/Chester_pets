<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>认证接口测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0A0D12;
      color: #e5e7eb;
      padding: 24px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 24px;
      color: #38BDF8;
    }
    .section {
      background: #161D2B;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .section h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #6EE7B7;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      color: #9ca3af;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #0F131C;
      border: 1px solid #1E2636;
      border-radius: 8px;
      color: #e5e7eb;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #38BDF8;
    }
    button {
      padding: 10px 20px;
      background: #38BDF8;
      border: none;
      border-radius: 8px;
      color: #0A0D12;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 8px;
    }
    button:hover {
      background: #0ea5e9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .output {
      background: #0F131C;
      border: 1px solid #1E2636;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .success { color: #6EE7B7; }
    .error { color: #f87171; }
    .info { color: #38BDF8; }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    .status.online { background: #6EE7B7; color: #0A0D12; }
    .status.offline { background: #1E2636; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 认证接口测试工具</h1>

    <div class="section">
      <h2>系统状态</h2>
      <p>
        在线模式: <span class="status" id="online-status">离线</span>
        <button onclick="toggleOnlineMode()">切换</button>
      </p>
      <p style="margin-top: 8px;">
        登录状态: <span id="login-status">未登录</span>
      </p>
      <p style="margin-top: 8px;">
        当前用户: <span id="current-user">--</span>
      </p>
      <button onclick="checkStatus()">刷新状态</button>
    </div>

    <div class="section">
      <h2>📝 注册</h2>
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="reg-email" placeholder="user@example.com">
      </div>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="reg-username" placeholder="3-50字符">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="reg-password" placeholder="至少8位">
      </div>
      <button onclick="register()">注册</button>
      <div class="output" id="reg-output"></div>
    </div>

    <div class="section">
      <h2>🔑 登录</h2>
      <div class="form-group">
        <label>账号（用户名或邮箱）</label>
        <input type="text" id="login-identifier" placeholder="username or email">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="password">
      </div>
      <button onclick="login()">登录</button>
      <div class="output" id="login-output"></div>
    </div>

    <div class="section">
      <h2>🚪 登出</h2>
      <button onclick="logout()">退出登录</button>
      <div class="output" id="logout-output"></div>
    </div>

    <div class="section">
      <h2>🔄 刷新 Token</h2>
      <button onclick="refreshToken()">刷新</button>
      <div class="output" id="refresh-output"></div>
    </div>

    <div class="section">
      <h2>🧪 测试后端连接</h2>
      <button onclick="testBackendConnection()">测试连接</button>
      <div class="output" id="test-output"></div>
    </div>
  </div>

  <script type="module">
    import { authStore } from './src/authStore.js';
    import { apiClient } from './src/api/authClient.js';

    window.authStore = authStore;
    window.apiClient = apiClient;

    // 订阅状态变化
    authStore.subscribe((state) => {
      updateStatus(state);
    });

    // 初始状态
    updateStatus(authStore.getState());

    function updateStatus(state) {
      const onlineEl = document.getElementById('online-status');
      onlineEl.textContent = state.onlineMode ? '在线' : '离线';
      onlineEl.className = state.onlineMode ? 'status online' : 'status offline';

      document.getElementById('login-status').textContent = state.isLoggedIn ? '已登录' : '未登录';
      document.getElementById('current-user').textContent = state.user?.username || '--';
    }

    window.checkStatus = () => {
      updateStatus(authStore.getState());
    };

    window.toggleOnlineMode = () => {
      const current = authStore.getState().onlineMode;
      authStore.setOnlineMode(!current);
      log('test-output', `在线模式已切换为: ${!current}`, 'info');
    };

    window.register = async () => {
      const email = document.getElementById('reg-email').value;
      const username = document.getElementById('reg-username').value;
      const password = document.getElementById('reg-password').value;

      if (!email || !username || !password) {
        log('reg-output', '请填写完整信息', 'error');
        return;
      }

      try {
        await authStore.accountRegister(email, username, password);
        log('reg-output', `注册成功！用户: ${username}`, 'success');
      } catch (err) {
        log('reg-output', `注册失败: ${err.message}`, 'error');
      }
    };

    window.login = async () => {
      const identifier = document.getElementById('login-identifier').value;
      const password = document.getElementById('login-password').value;

      if (!identifier || !password) {
        log('login-output', '请填写账号和密码', 'error');
        return;
      }

      try {
        await authStore.accountLogin(identifier, password);
        log('login-output', `登录成功！`, 'success');
      } catch (err) {
        log('login-output', `登录失败: ${err.message}`, 'error');
      }
    };

    window.logout = async () => {
      try {
        await authStore.logout();
        log('logout-output', '已退出登录', 'success');
      } catch (err) {
        log('logout-output', `退出失败: ${err.message}`, 'error');
      }
    };

    window.refreshToken = async () => {
      try {
        await authStore.refreshToken();
        log('refresh-output', 'Token 刷新成功', 'success');
      } catch (err) {
        log('refresh-output', `刷新失败: ${err.message}`, 'error');
      }
    };

    window.testBackendConnection = async () => {
      log('test-output', '测试后端连接...', 'info');
      try {
        const response = await fetch('http://127.0.0.1:8000/api/v1/health');
        if (response.ok) {
          const data = await response.json();
          log('test-output', `后端连接成功: ${JSON.stringify(data)}`, 'success');
        } else {
          log('test-output', `后端响应错误: ${response.status}`, 'error');
        }
      } catch (err) {
        log('test-output', `后端连接失败: ${err.message}\n请确保后端已启动: http://127.0.0.1:8000`, 'error');
      }
    };

    function log(elementId, message, type = 'info') {
      const el = document.getElementById(elementId);
      const timestamp = new Date().toLocaleTimeString();
      el.className = `output ${type}`;
      el.textContent = `[${timestamp}] ${message}`;
    }
  </script>
</body>
</html>
